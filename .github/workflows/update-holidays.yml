name: Update holidays

# 공공데이터포털 특일정보 API로 holidays.js 를 갱신하고, 바뀐 내용이 있으면 커밋합니다.
# 필요한 설정: 저장소 Settings → Secrets and variables → Actions 에 HOLIDAY_API_KEY 등록

on:
  schedule:
    - cron: '17 0 1 * *' # 매월 1일 09:17 KST
  workflow_dispatch:
    inputs:
      years:
        description: '조회할 연도 (공백 구분, 비우면 작년~내년)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: update-holidays
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch holidays
        env:
          HOLIDAY_API_KEY: ${{ secrets.HOLIDAY_API_KEY }}
          YEARS: ${{ github.event.inputs.years }}
        run: |
          if [ -z "$HOLIDAY_API_KEY" ]; then
            echo "::warning::HOLIDAY_API_KEY 시크릿이 없어 공휴일 갱신을 건너뜁니다."
            exit 0
          fi
          node scripts/fetch-holidays.mjs $YEARS

      - name: Test
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Commit changes
        run: |
          if git diff --quiet -- holidays.js; then
            echo "변경 사항 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add holidays.js
          git commit -m "chore: 공휴일 데이터 자동 갱신"
          git push
